<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#020617"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="230" height="700" fill="#0f172a"/>
  <text x="35" y="55" fill="#818cf8" font-size="24" font-family="Arial" font-weight="bold">
    ExpensePro
  </text>

  <rect x="25" y="100" width="180" height="45" rx="8" fill="#4f46e5"/>
  <text x="50" y="129" fill="white" font-size="15" font-family="Arial">Dashboard</text>

  <text x="50" y="185" fill="#94a3b8" font-size="15" font-family="Arial">Income</text>
  <text x="50" y="230" fill="#94a3b8" font-size="15" font-family="Arial">Expenses</text>
  <text x="50" y="275" fill="#94a3b8" font-size="15" font-family="Arial">Budget</text>
  <text x="50" y="320" fill="#94a3b8" font-size="15" font-family="Arial">Analytics</text>

  <!-- Main -->
  <text x="275" y="60" fill="white" font-size="27" font-family="Arial" font-weight="bold">
    Financial Dashboard
  </text>

  <!-- Cards -->
  <rect x="275" y="95" width="250" height="120" rx="15" fill="#0f172a"/>
  <text x="300" y="130" fill="#94a3b8" font-size="14" font-family="Arial">Total Income</text>
  <text x="300" y="175" fill="#22c55e" font-size="27" font-family="Arial" font-weight="bold">
    ₹85,000
  </text>

  <rect x="545" y="95" width="250" height="120" rx="15" fill="#0f172a"/>
  <text x="570" y="130" fill="#94a3b8" font-size="14" font-family="Arial">Total Expense</text>
  <text x="570" y="175" fill="#f97316" font-size="27" font-family="Arial" font-weight="bold">
    ₹32,450
  </text>

  <rect x="815" y="95" width="330" height="120" rx="15" fill="#0f172a"/>
  <text x="840" y="130" fill="#94a3b8" font-size="14" font-family="Arial">Available Balance</text>
  <text x="840" y="175" fill="#818cf8" font-size="27" font-family="Arial" font-weight="bold">
    ₹52,550
  </text>

  <!-- Chart -->
  <rect x="275" y="245" width="520" height="330" rx="15" fill="#0f172a"/>
  <text x="300" y="285" fill="white" font-size="18" font-family="Arial" font-weight="bold">
    Monthly Overview
  </text>

  <line x1="320" y1="510" x2="750" y2="510" stroke="#334155"/>

  <rect x="350" y="420" width="40" height="90" rx="5" fill="#6366f1"/>
  <rect x="410" y="380" width="40" height="130" rx="5" fill="#22c55e"/>

  <rect x="480" y="395" width="40" height="115" rx="5" fill="#6366f1"/>
  <rect x="540" y="350" width="40" height="160" rx="5" fill="#22c55e"/>

  <rect x="610" y="410" width="40" height="100" rx="5" fill="#6366f1"/>
  <rect x="670" y="330" width="40" height="180" rx="5" fill="#22c55e"/>

  <!-- Transactions -->
  <rect x="815" y="245" width="330" height="330" rx="15" fill="#0f172a"/>
  <text x="840" y="285" fill="white" font-size="18" font-family="Arial" font-weight="bold">
    Recent Transactions
  </text>

  <circle cx="855" cy="335" r="18" fill="#22c55e"/>
  <text x="885" y="332" fill="white" font-size="14" font-family="Arial">Salary</text>
  <text x="885" y="352" fill="#22c55e" font-size="13" font-family="Arial">+ ₹50,000</text>

  <circle cx="855" cy="405" r="18" fill="#f97316"/>
  <text x="885" y="402" fill="white" font-size="14" font-family="Arial">Shopping</text>
  <text x="885" y="422" fill="#f97316" font-size="13" font-family="Arial">- ₹4,500</text>

  <circle cx="855" cy="475" r="18" fill="#f97316"/>
  <text x="885" y="472" fill="white" font-size="14" font-family="Arial">Food</text>
  <text x="885" y="492" fill="#f97316" font-size="13" font-family="Arial">- ₹1,250</text>
</svg>